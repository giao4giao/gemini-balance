<!-- START OF FILE base.html -->
<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>{% block title %}Service Gateway{% endblock %}</title>
    <link rel="manifest" href="{{ static_url('manifest.json') }}" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" href="{{ static_url('icons/icon-192x192.png') }}" />
    <!-- 使用 Inter 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="{{ static_url('js/tailwindcss.js') }}"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
            },
            colors: {
              primary: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8", 900: "#1e3a8a" },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      };
    </script>
    <style>
      /* 全局背景纹理 */
      body {
        background-color: #f8fafc;
        background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
        background-size: 24px 24px;
        color: #334155;
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* 输入框统一样式覆盖 */
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }

      /* 通知条样式 */
      .notification {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        padding: 1rem 1.5rem;
        border-radius: 0.75rem;
        background-color: #ffffff;
        border-left: 4px solid #10b981;
        color: #1f2937;
        font-weight: 500;
        z-index: 1000;
        transform: translateX(120%);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .notification.show { transform: translateX(0); }
      .notification.error { border-left-color: #ef4444; }

      /* 加载动画 */
      .loading-spin { animation: spin 1s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      {% block head_extra_styles %}{% endblock %}
    </style>
    {% block head_extra_scripts %}{% endblock %}
  </head>
  <body class="flex flex-col min-h-screen selection:bg-blue-100 selection:text-blue-900">

    <!-- 顶部导航栏：半透明磨砂效果 -->
    <header class="fixed w-full top-0 z-30 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-gray-200/60 supports-[backdrop-filter]:bg-white/60">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16">
        <div class="flex justify-between items-center h-full">
          <!-- Logo -->
          <div class="flex items-center gap-3 group cursor-default">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:scale-105 transition-transform duration-300">
              <i class="fa-solid fa-network-wired text-sm"></i>
            </div>
            <div class="flex flex-col">
              <span class="font-bold text-gray-900 leading-tight tracking-tight">API Gateway</span>
              <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Dashboard</span>
            </div>
          </div>

          <!-- 版本信息 -->
          <div id="version-info-container" class="flex items-center">
             <!-- JS 动态注入 -->
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区域：增加顶部内边距以避开 fixed header -->
    <main class="flex-grow flex flex-col pt-16 relative w-full">
      {% block content %}{% endblock %}
    </main>

    <!-- 底部：极简风格 -->
    <footer class="mt-auto py-6 flex-none">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-center md:justify-between items-center text-xs text-gray-400 gap-2 border-t border-gray-200/60 pt-6">
           <div><span id="copyright-year"></span> © System Infrastructure. All rights reserved.</div>
           <div class="flex items-center gap-2">
             <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
             <span>System Operational</span>
           </div>
        </div>
      </div>
    </footer>

    <script>
      document.getElementById("copyright-year").textContent = new Date().getFullYear();

      function showNotification(message, type = "success", duration = 3000) {
        let notification = document.getElementById("notification");
        if(!notification) {
           notification = document.createElement("div");
           notification.id = "notification";
           document.body.appendChild(notification);
        }

        // 动态添加图标
        const icon = type === 'error' ? '<i class="fas fa-circle-xmark text-red-500 text-lg"></i>' : '<i class="fas fa-circle-check text-emerald-500 text-lg"></i>';

        notification.innerHTML = `${icon}<span>${message}</span>`;
        notification.className = "notification show";
        if (type === "error") notification.classList.add("error");

        if (notification.timeoutId) clearTimeout(notification.timeoutId);
        notification.timeoutId = setTimeout(() => notification.classList.remove("show"), duration);
      }

      // 版本检查逻辑保持不变
      const versionContainer = document.getElementById("version-info-container");
      async function fetchVersionInfo() {
        if (!versionContainer) return;
        try {
          const response = await fetch("/api/version/check");
          if (!response.ok) return;
          const data = await response.json();
          const ver = data.current_version || "Unknown";

          let html = '';
          if (data.update_available) {
             html = `<a href="https://github.com/snailyp/gemini-balance/releases" target="_blank" class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 border border-blue-100 rounded-full text-xs font-semibold text-blue-600 hover:bg-blue-100 transition-colors"><span class="flex h-2 w-2 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span></span>v${ver} Available</a>`;
          } else {
             html = `<div class="flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-full text-xs font-medium text-gray-500 shadow-sm">v${ver}</div>`;
          }
          versionContainer.innerHTML = html;
        } catch (e) {}
      }
      fetchVersionInfo();
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
